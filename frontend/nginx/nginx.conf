server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response (HSTS/CSP/etc).
    include /etc/nginx/security-headers.conf;

    # SPA: let the client-side router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html fallback target of try_files above; never cache it so a fresh
    # deploy's hashed asset references are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Reverse-proxy the REST API to the backend container. No trailing slash on proxy_pass so the
    # original "/api/..." path is preserved (the controllers are mapped under /api).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation id: reuse nginx's per-request id so backend logs tie to the access log.
        proxy_set_header X-Request-Id      $request_id;
    }

    # OpenAPI spec + Swagger UI (handy in the demo; drop these in a locked-down deployment).
    location /v3/api-docs   { proxy_pass http://app:8080; }
    location /swagger-ui    { proxy_pass http://app:8080; }
    location /swagger-ui.html { proxy_pass http://app:8080; }
    location /webjars       { proxy_pass http://app:8080; }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header above discards server-level inherited headers, so re-include.
        include /etc/nginx/security-headers.conf;
    }
}
