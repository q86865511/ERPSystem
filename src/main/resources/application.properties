spring.application.name=erp

# Flyway owns the schema; Hibernate only validates that entities match it (fail fast on drift).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Expose a health endpoint for the reconciliation/health story (and Docker healthchecks later).
management.endpoints.web.exposure.include=health,info

# --- Auth (JWT) ---
# HS256 secret (>= 32 bytes). Override with APP_JWT_SECRET in any real deployment; the default is dev-only.
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-secret-change-me-at-least-32-bytes}
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=P7D
# Mark the refresh cookie Secure. False for the plain-HTTP local demo; set APP_JWT_COOKIE_SECURE=true in
# production (browser is HTTPS via Cloudflare even though the app sees HTTP behind the proxy).
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
# Honor X-Forwarded-Proto from the fronting nginx so request.isSecure()/scheme reflect the real client.
server.forward-headers-strategy=FRAMEWORK

# --- OpenAPI / Swagger (springdoc) ---
# /v3/api-docs is the spec the React TypeScript client is generated from; ordering keys keeps the
# emitted spec stable so generated types don't churn on every build.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
