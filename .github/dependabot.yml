# Weekly dependency update PRs across all three ecosystems this repo uses:
# the Maven backend (root), the npm frontend (frontend/), and the GitHub Actions workflows.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "依賴"
    groups:
      # Keep the noise down: bundle the Spring Boot BOM-managed bumps into one PR.
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "依賴(前端)"
    groups:
      mantine:
        patterns:
          - "@mantine/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
