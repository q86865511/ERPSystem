name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test & ArchUnit boundary checks
        run: ./mvnw -B -ntp verify

      # Testcontainers uses the Docker engine that is preinstalled on the
      # ubuntu-latest runner — no extra service container needed.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # Type-check (tsc -b) + production bundle (vite build) against the committed OpenAPI types.
      - name: Type-check & build
        run: npm run build
        working-directory: frontend
