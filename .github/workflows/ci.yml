name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: jobs only read the repo. The coverage badge is committed by a separate
# workflow_run-triggered workflow, so nothing here needs write access.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test & ArchUnit boundary checks
        run: ./mvnw -B -ntp verify

      # Testcontainers uses the Docker engine that is preinstalled on the
      # ubuntu-latest runner — no extra service container needed.

      # Surface the coverage figure on the run page (report-only; JaCoCo never fails the build).
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1 {miss+=$4; cov+=$5} END {
              total=miss+cov; pct=(total>0)?100*cov/total:0;
              printf "## Coverage: %.1f%% (instructions, unit + IT)\n", pct
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Make the existing rigor one click away from the PR: full JaCoCo HTML report plus the raw
      # Surefire/Failsafe/ArchUnit results (ArchUnit runs as JUnit, so its outcome is in surefire-reports).
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # Guards against committed OpenAPI-generated types drifting from openapi/openapi.json (regenerates
      # schema.d.ts, then fails the build if that produces an uncommitted diff).
      - name: Check generated API types are up to date
        run: npm run gen:api:check
        working-directory: frontend

      # Type-check (tsc -b) + production bundle (vite build) against the committed OpenAPI types.
      - name: Type-check & build
        run: npm run build
        working-directory: frontend

      # Unit + component tests (Vitest/jsdom — no server needed) and a typecheck of the test sources.
      - name: Test
        run: npm run test:run
        working-directory: frontend

      - name: Typecheck tests
        run: npm run test:types
        working-directory: frontend

      # Deterministic navigation E2E (ERP-001 regression): Playwright serves the built dist and mocks
      # /api, so it needs no backend and no live demo. `npm run build` above already produced dist/.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: E2E navigation regression (mocked API)
        run: npm run e2e:local
        working-directory: frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mcp-server

      - name: Build
        run: npm run build
        working-directory: mcp-server

      # Unit tests only (mocked fetch — no ERP backend is started, no network access needed).
      - name: Test
        run: npm test
        working-directory: mcp-server
