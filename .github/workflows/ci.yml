name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test & ArchUnit boundary checks
        run: ./mvnw -B -ntp verify

      # Testcontainers uses the Docker engine that is preinstalled on the
      # ubuntu-latest runner — no extra service container needed.
