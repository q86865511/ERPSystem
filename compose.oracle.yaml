# Reverse-proxy overlay for the Oracle deployment — DO NOT use for the local one-command demo.
#
# Public access is via Cloudflare Tunnel -> Caddy -> 127.0.0.1:8081, so the frontend must bind to
# loopback only (never 0.0.0.0). `!override` REPLACES the base service's ports instead of the default
# list-append, so we don't end up binding both 8081:80 and 127.0.0.1:8081:80. Requires Compose >= 2.24.4.
#
# Usage on the host:
#   docker compose -f compose.demo.yaml -f compose.oracle.yaml up -d --build
#
# Note: deliberately no top-level `name:` here — the project name (erp-demo) comes from compose.demo.yaml.
# Adding a different name would split the project and break the scope of `down`/`--remove-orphans`.
services:
  frontend:
    ports: !override
      - "127.0.0.1:8081:80"
